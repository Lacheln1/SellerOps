# 로컬 개발용 인프라 (MySQL, Redis). 운영 설정이 아니다.
# 기본값으로 바로 동작하고, 바꾸려면 .env.example을 .env로 복사해서 수정한다.
name: sellerops

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sellerops}
      MYSQL_USER: ${MYSQL_USER:-sellerops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-sellerops}
      TZ: UTC
    ports:
      # 호스트에 설치된 MySQL(3306)과 겹치지 않게 3307을 기본으로 쓴다.
      - '127.0.0.1:${MYSQL_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ 요구사항: 메모리가 차도 키를 지우지 않는다(noeviction). AOF로 재시작 후에도 작업 유지.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
